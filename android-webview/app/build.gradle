plugins {
    id "com.android.application"
}

android {
    namespace "com.newhim3.studyhub"
    compileSdk 35

    defaultConfig {
        applicationId "com.newhim3.studyhub"
        minSdk 23
        targetSdk 35
        def buildNumber = project.findProperty("versionCode") ?: "1"
        versionCode buildNumber.toInteger()
        versionName "1.0." + buildNumber
    }

    signingConfigs {
        release {
            storeFile file(project.findProperty("storeFile") ?: "release.keystore")
            storePassword project.findProperty("storePassword") ?: ""
            keyAlias project.findProperty("keyAlias") ?: "mayuan"
            keyPassword project.findProperty("keyPassword") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // Serves the packaged web app from https://appassets.androidplatform.net, a
    // real secure origin, so the page's fetch() of its own question bank is an
    // ordinary same-origin request. On a file:// page that request is refused,
    // which left the app stuck on "Failed to fetch".
    implementation "androidx.webkit:webkit:1.13.0"
}
