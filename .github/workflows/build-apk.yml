name: Build Android APK

on:
  push:
    branches: [main, gh-pages]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-webview
    steps:
      # Always build the Android wrapper from main. The wrapper loads the
      # latest web app from GitHub Pages at runtime.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk mayuan-study.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mayuan-study-debug-apk
          path: android-webview/mayuan-study.apk
          if-no-files-found: error
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "apk-build-${{ github.run_number }}"
          mayuan-study.apk
          --title "马原刷题 APK #${{ github.run_number }}"
          --notes "自动构建版本。安装后会加载 GitHub Pages 上的最新网页内容。"
          --latest
