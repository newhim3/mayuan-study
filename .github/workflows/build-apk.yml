name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-webview/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-webview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk mayuan-study.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mayuan-study-debug-apk
          path: android-webview/mayuan-study.apk
          if-no-files-found: error
      - name: Publish downloadable test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "apk-build-${{ github.run_number }}"
          mayuan-study.apk
          --title "马原刷题 APK 测试版 #${{ github.run_number }}"
          --notes "在线 WebView 测试版。安装后会加载 GitHub Pages 上的最新题库内容。"
          --latest
